name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["noci"]

# Behövs för att kunna ladda upp SARIF till GitHub Code Scanning
permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_BASE: /api

jobs:
  # ============================================================
  # 1) BACKEND -> KONTRAKT (dtos.json)
  # ============================================================
  backend_contract:
    name: Backend contract (dotnet=8.0.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: NuGet vulnerable packages (fail if any)
        run: |
          set -e
          OUT=$(dotnet list UsersAndPosts.sln package --vulnerable --include-transitive)
          echo "$OUT"
          echo "$OUT" | grep -qi "vulnerab" && (echo "Vulnerable packages found" && exit 1) || true

      - name: Build (needed for generator)
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Fail if dotnet build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      - name: Generate dtos.json from C# DTOs
        run: dotnet run -c Release --project UsersAndPosts.DtoContractGen

      - name: Validate dtos.json exists and is valid JSON
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json was not generated" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('UsersAndPosts/dtos.json','utf8')); console.log('dtos.json OK');"

      - name: Upload artifact (dtos.json)
        uses: actions/upload-artifact@v4
        with:
          name: contract-dtos-json
          path: UsersAndPosts/dtos.json
          if-no-files-found: error

  # ============================================================
  # 2A) FRONTEND BUILD (parallellt med backend_test)
  # ============================================================
  frontend_build:
    name: Frontend build (node=${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: backend_contract

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact (dtos.json)
        uses: actions/download-artifact@v4
        with:
          name: contract-dtos-json
          path: UsersAndPosts

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: UsersAndPostsClient/package-lock.json

      - name: Install client deps
        working-directory: UsersAndPostsClient
        run: npm ci

      - name: Generate dtos.ts from dtos.json
        working-directory: UsersAndPostsClient
        run: npm run gen:dtos

      # =========================================================
      # 🧾 SARIF: ESLint -> SARIF (rapport + gate)
      # =========================================================
      - name: Run ESLint (emit SARIF)
        id: eslint
        working-directory: UsersAndPostsClient
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/sarif"
          npm i --no-save @microsoft/eslint-formatter-sarif

          set +e
          npx eslint . \
            -f @microsoft/eslint-formatter-sarif \
            -o "$GITHUB_WORKSPACE/artifacts/sarif/eslint-node${{ matrix.node }}.sarif"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF (eslint)
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/artifacts/sarif/eslint-node${{ matrix.node }}.sarif
          category: eslint-node${{ matrix.node }}

      - name: Fail if ESLint found issues
        if: ${{ steps.eslint.outputs.exit_code != '0' }}
        run: |
          echo "ESLint found issues (exit=${{ steps.eslint.outputs.exit_code }})"
          exit 1

      - name: Build client (writes to API wwwroot)
        working-directory: UsersAndPostsClient
        run: npm run build

      - name: Fail if NPM build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      - name: Upload artifact (wwwroot)
        uses: actions/upload-artifact@v4
        with:
          name: client-wwwroot-node${{ matrix.node }}
          path: UsersAndPosts/wwwroot
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Frontend build summary"
            echo ""
            echo "- Matrix: **Node ${{ matrix.node }}**"
            echo "- ✅ Downloaded DTO contract: \`UsersAndPosts/dtos.json\`"
            echo "- ✅ Generated TypeScript types: \`UsersAndPostsClient/.../dtos.ts\` (via \`npm run gen:dtos\`)"
            echo "- ✅ Built client into API \`UsersAndPosts/wwwroot\`"
            echo "- 📦 Uploaded artifact: **client-wwwroot-node${{ matrix.node }}**"
            echo ""
            echo "### Code scanning (SARIF)"
            echo "- ESLint SARIF emitted to: \`artifacts/sarif/eslint-node${{ matrix.node }}.sarif\`"
            echo "- Uploaded to GitHub Code Scanning as category: **eslint-node${{ matrix.node }}**"
            echo "- ESLint exit code: \`${{ steps.eslint.outputs.exit_code }}\`"
            echo ""
            echo "View results in **Security → Code scanning**."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 2B) BACKEND TEST (parallellt med frontend_build)
  # ============================================================
  backend_test:
    name: Backend test (dotnet=${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    needs: backend_contract

    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x", "9.0.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact (dtos.json)
        uses: actions/download-artifact@v4
        with:
          name: contract-dtos-json
          path: UsersAndPosts

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: Build
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      # =========================================================
      # 🔐 Beräkna unik SQLite-path per parallellt jobb
      # =========================================================
      - name: Compute SQLite DB path
        id: db
        env:
          BASE: ${{ secrets.SQLITE_DB_PATH }}
        run: |
          UNIQUE="${BASE%.db}-${{ matrix.dotnet }}-${{ github.run_id }}.db"
          echo "path=$UNIQUE" >> "$GITHUB_OUTPUT"
          mkdir -p "$(dirname "$UNIQUE")"
          touch "$UNIQUE"

      - name: Test
        env:
          Db__Path: ${{ steps.db.outputs.path }}
        run: dotnet test UsersAndPosts.sln -c Release --no-build

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Backend test summary"
            echo ""
            echo "- Matrix: **.NET ${{ matrix.dotnet }}**"
            echo "- ✅ Downloaded DTO contract: \`UsersAndPosts/dtos.json\`"
            echo "- ✅ Built solution in Release"
            echo "- ✅ Ran tests: \`dotnet test\`"
            echo ""
            echo "### Test database (SQLite)"
            echo "- Db path injected via env: \`Db__Path\`"
            echo "- Unique DB per job: ✅ (prevents parallel locking issues)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 2C) CODEQL (C#) -> SARIF till Code Scanning
  # ============================================================
  codeql_dotnet:
    name: CodeQL (C#) SARIF
    runs-on: ubuntu-latest

    # Skippa fork-PRs (saknar ofta rätt behörighet för security-events upload)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-csharp

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CodeQL (C#) summary"
            echo ""
            echo "- ✅ CodeQL initialized for **C#**"
            echo "- ✅ Autobuild completed"
            echo "- ✅ Analysis uploaded to GitHub Code Scanning"
            echo "- Category: **codeql-csharp**"
            echo ""
            echo "View results in **Security → Code scanning**."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 3) PUBLISH (väntar på både frontend + backend_test + CodeQL)
  # ============================================================
  publish:
    name: Publish (dotnet=8.0.x, wwwroot=node20.x)
    runs-on: ubuntu-latest
    needs: [frontend_build, backend_test, codeql_dotnet]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact (dtos.json)
        uses: actions/download-artifact@v4
        with:
          name: contract-dtos-json
          path: UsersAndPosts

      - name: Download artifact (wwwroot from node20)
        uses: actions/download-artifact@v4
        with:
          name: client-wwwroot-node20.x
          path: UsersAndPosts/wwwroot

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: Build
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Publish API (includes wwwroot)
        run: dotnet publish UsersAndPosts/UsersAndPosts.csproj -c Release -o out --no-build

      - name: Copy dtos.json into publish root
        run: cp UsersAndPosts/dtos.json out/dtos.json

      - name: Upload artifact (published app)
        uses: actions/upload-artifact@v4
        with:
          name: UsersAndPosts-publish
          path: out

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Publish summary"
            echo ""
            echo "- ✅ Downloaded DTO contract + canonical frontend wwwroot (node20.x)"
            echo "- ✅ Published API to \`out/\`"
            echo "- ✅ Copied \`dtos.json\` into publish root"
            echo "- 📦 Uploaded artifact: **UsersAndPosts-publish**"
          } >> "$GITHUB_STEP_SUMMARY"
