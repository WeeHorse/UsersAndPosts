# ============================================================
# CI (Continuous Integration) för UsersAndPosts
#
# Steg 2 (Deep Dive): Artefakter mellan jobb
# - backend_contract producerar dtos.json → upload artifact
# - frontend_build konsumerar dtos.json, bygger wwwroot → upload artifact
# - test konsumerar dtos.json + wwwroot → kör tester
# - publish konsumerar dtos.json + wwwroot → dotnet publish → upload artifact
# ============================================================

name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["noci"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Publik frontend-config (ingen hemlig data i frontend!)
  VITE_API_BASE: /api

jobs:
  # ============================================================
  # 1) BACKEND + KONTRAKT
  # ============================================================
  backend_contract:
    name: Backend contract (dotnet=8.0.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: NuGet vulnerable packages (fail if any)
        run: |
          set -e
          OUT=$(dotnet list UsersAndPosts.sln package --vulnerable --include-transitive)
          echo "$OUT"
          echo "$OUT" | grep -qi "vulnerab" && (echo "Vulnerable packages found" && exit 1) || true

      - name: Build (needed for generator)
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Fail if dotnet build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      - name: Generate dtos.json from C# DTOs
        run: dotnet run -c Release --project UsersAndPosts.DtoContractGen

      - name: Validate dtos.json exists and is valid JSON
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json was not generated" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('UsersAndPosts/dtos.json','utf8')); console.log('dtos.json OK');"

      # --- ARTEFAKT 1: dtos.json ---
      - name: Upload artifact (dtos.json)
        uses: actions/upload-artifact@v4
        with:
          name: contract-dtos-json
          path: UsersAndPosts/dtos.json
          if-no-files-found: error


  # ============================================================
  # 2) FRONTEND BUILD
  # ============================================================
  frontend_build:
    name: Frontend build (node=${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: backend_contract

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hämta kontraktet från föregående jobb
      - name: Download artifact (dtos.json)
        uses: actions/download-artifact@v4
        with:
          name: contract-dtos-json
          path: UsersAndPosts

      - name: Validate downloaded dtos.json
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json missing after download" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('UsersAndPosts/dtos.json','utf8')); console.log('downloaded dtos.json OK');"

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: UsersAndPostsClient/package-lock.json

      - name: Install client deps
        working-directory: UsersAndPostsClient
        run: npm ci

      # Generera TypeScript-typer från det nedladdade kontraktet
      - name: Generate dtos.ts from dtos.json
        working-directory: UsersAndPostsClient
        run: npm run gen:dtos

      # Bygg klienten → skriver till API-projektets wwwroot
      - name: Build client (writes to API wwwroot)
        working-directory: UsersAndPostsClient
        run: npm run build

      - name: Fail if NPM build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      # --- ARTEFAKT 2: wwwroot ---
      - name: Upload artifact (wwwroot)
        uses: actions/upload-artifact@v4
        with:
          name: client-wwwroot-node${{ matrix.node }}
          path: UsersAndPosts/wwwroot
          if-no-files-found: error


  # ============================================================
  # 3) TEST
  # ============================================================
  test:
    name: Test (dotnet=8.0.x, node=20.x)
    runs-on: ubuntu-latest
    needs: frontend_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (Val) Hämta kontrakt + wwwroot så test körs "efter kedjan"
      - name: Download artifact (dtos.json)
        uses: actions/download-artifact@v4
        with:
          name: contract-dtos-json
          path: UsersAndPosts

      # Välj en “canonical” frontend-artefakt för test (t.ex. Node 20)
      - name: Download artifact (wwwroot from node20)
        uses: actions/download-artifact@v4
        with:
          name: client-wwwroot-node20.x
          path: UsersAndPosts/wwwroot

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: Build
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Test
        run: dotnet test UsersAndPosts.sln -c Release --no-build


  # ============================================================
  # 4) PUBLISH + DEPLOYBAR ARTEFAKT
  # ============================================================
  publish:
    name: Publish (dotnet=8.0.x)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact (dtos.json)
        uses: actions/download-artifact@v4
        with:
          name: contract-dtos-json
          path: UsersAndPosts

      - name: Download artifact (wwwroot from node20)
        uses: actions/download-artifact@v4
        with:
          name: client-wwwroot-node20.x
          path: UsersAndPosts/wwwroot

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: Build
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Publish API (includes wwwroot)
        run: dotnet publish UsersAndPosts/UsersAndPosts.csproj -c Release -o out --no-build

      - name: Copy dtos.json into publish root
        run: cp UsersAndPosts/dtos.json out/dtos.json

      - name: Upload artifact (published app)
        uses: actions/upload-artifact@v4
        with:
          name: UsersAndPosts-publish
          path: out

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI summary (Step 2)"
            echo ""
            echo "- ✅ backend_contract produced artifact: **contract-dtos-json**"
            echo "- ✅ frontend_build consumed dtos.json and produced artifact: **client-wwwroot-node20.x** (and node18)"
            echo "- ✅ test consumed dtos.json + wwwroot and ran \`dotnet test\`"
            echo "- ✅ publish consumed dtos.json + wwwroot and produced deployable artifact: **UsersAndPosts-publish**"
          } >> "$GITHUB_STEP_SUMMARY"
