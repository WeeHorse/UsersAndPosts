# ============================================================
# CI (Continuous Integration) för UsersAndPosts
#
# Steg 1 (Deep Dive): Job-split med dependencies (needs)
#
# Målbild (samma som tidigare):
# - Bygga + testa en fullstack-app (ASP.NET + React)
# - Köra en kontraktskedja (C# DTOs → dtos.json → dtos.ts)
# - Köra grundläggande säkerhetsgate (NuGet vulnerabilities)
# - Köra lint/checks utan att auto-fixa eller ändra filer
# - Skapa en deploybar artefakt (dotnet publish + wwwroot)
#
# Viktig princip:
# CI ska vara en "objektiv grind": samma checklista för alla commits.
# ============================================================

name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["cidev"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1) BACKEND + KONTRAKT
  # - .NET setup/restore
  # - Security gate: vulnerable packages
  # - dotnet format (verify)
  # - build (Release)
  # - generera dtos.json
  # - reproducibility gate (bygg ska inte ändra spårade filer)
  # ============================================================
  backend_contract:
    name: Backend + Contract (dotnet=${{ matrix.dotnet }}, node=${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]
        dotnet: ["8.0.x", "9.0.x"]
        exclude:
          - node: "18.x"
            dotnet: "9.0.x"
          - node: "20.x"
            dotnet: "8.0.x"

    env:
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      # -----------------------------
      # Security gate (FIXAD):
      # Failar om output innehåller "vulnerab"
      # -----------------------------
      - name: NuGet vulnerable packages (fail if any)
        run: |
          set -e
          OUT=$(dotnet list UsersAndPosts.sln package --vulnerable --include-transitive)
          echo "$OUT"
          echo "$OUT" | grep -qi "vulnerab"
          if [ $? -eq 0 ]; then
            echo "Vulnerable packages found"
            exit 1
          fi

      - name: C# format check (dotnet format)
        run: dotnet format --verify-no-changes

      - name: Build (needed for generator)
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Fail if dotnet build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      - name: Generate dtos.json from C# DTOs
        run: dotnet run -c Release --project UsersAndPosts.DtoContractGen

      - name: Validate dtos.json exists and is valid JSON
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json was not generated" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('UsersAndPosts/dtos.json','utf8')); console.log('dtos.json OK');"

  # ============================================================
  # 2) FRONTEND
  # - Node setup
  # - npm ci
  # - eslint (check-mode)
  # - gen dtos.ts (konsumerar dtos.json från repo-workspace)
  # - build (skriver till API wwwroot)
  # - reproducibility gate
  #
  # Not: I steg 1 delar vi jobb men introducerar INTE artifacts
  # mellan jobb ännu. Det kommer i steg 2.
  # ============================================================
  frontend_build:
    name: Frontend (dotnet=${{ matrix.dotnet }}, node=${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: backend_contract

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]
        dotnet: ["8.0.x", "9.0.x"]
        exclude:
          - node: "18.x"
            dotnet: "9.0.x"
          - node: "20.x"
            dotnet: "8.0.x"

    env:
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: UsersAndPostsClient/package-lock.json

      - name: Install client deps
        working-directory: UsersAndPostsClient
        run: npm ci

      - name: Lint client (ESLint)
        working-directory: UsersAndPostsClient
        run: npm run lint

      - name: Generate dtos.ts from generated dtos.json
        working-directory: UsersAndPostsClient
        run: npm run gen:dtos

      - name: Build client (writes to API wwwroot)
        working-directory: UsersAndPostsClient
        run: npm run build

      - name: Fail if NPM build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

  # ============================================================
  # 3) TEST + PUBLISH + ARTIFACT
  # - kör dotnet test
  # - publish till ./out
  # - kopiera dtos.json till publish-rot
  # - ladda upp deploybar artefakt
  # - job summary
  #
  # needs: kräver både backend_contract och frontend_build
  # ============================================================
  test_publish:
    name: Test + Publish (dotnet=${{ matrix.dotnet }}, node=${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [backend_contract, frontend_build]

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]
        dotnet: ["8.0.x", "9.0.x"]
        exclude:
          - node: "18.x"
            dotnet: "9.0.x"
          - node: "20.x"
            dotnet: "8.0.x"

    env:
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      # Bygg/test ska vara stabilt även om frontend byggt wwwroot i annan job.
      # (I steg 2 kommer vi använda artifacts för att göra detta "fysiskt".)
      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: Build (Release)
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Test
        run: dotnet test UsersAndPosts.sln -c Release --no-build

      - name: Publish API
        run: dotnet publish UsersAndPosts/UsersAndPosts.csproj -c Release -o out --no-build

      - name: Copy dtos.json into publish root
        run: cp UsersAndPosts/dtos.json out/dtos.json

      - name: Upload artifact (published app)
        uses: actions/upload-artifact@v4
        with:
          name: UsersAndPosts-publish-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: out

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "- Matrix: **.NET ${{ matrix.dotnet }}** × **Node ${{ matrix.node }}**"
            echo "- ✅ Generated \`UsersAndPosts/dtos.json\` at build time"
            echo "- ✅ Generated \`UsersAndPostsClient/src/generated/dtos.ts\` from that contract"
            echo "- ✅ Built client into API \`wwwroot\`"
            echo "- ✅ Built + tested + published API"
            echo "- 📦 Uploaded artifact: **UsersAndPosts-publish-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}**"
          } >> "$GITHUB_STEP_SUMMARY"
