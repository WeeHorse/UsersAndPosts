# ============================================================
# CI (Step 1): Job DAG med needs
# - Inga artefakter mellan jobs än (det kommer i Step 2)
# ============================================================

name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["noci"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_BASE: /api

jobs:
  # ============================================================
  # 1) BACKEND QUALITY + CONTRACT
  # ============================================================
  backend_quality:
    name: Backend quality + contract (dotnet=${{ matrix.dotnet }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x", "9.0.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: NuGet vulnerable packages (fail if any)
        run: |
          set -e
          OUT=$(dotnet list UsersAndPosts.sln package --vulnerable --include-transitive)
          echo "$OUT"
          echo "$OUT" | grep -qi "vulnerab" && (echo "Vulnerable packages found" && exit 1) || true

      - name: Build (needed for generator)
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Fail if dotnet build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      - name: Generate dtos.json from C# DTOs
        run: dotnet run -c Release --project UsersAndPosts.DtoContractGen

      - name: Validate dtos.json exists and is valid JSON
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json was not generated" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('UsersAndPosts/dtos.json','utf8')); console.log('dtos.json OK');"


  # ============================================================
  # 2) FRONTEND BUILD
  # - needs: backend_quality  (Steg 1: bara ordning, inga artefakter)
  # ============================================================
  frontend_build:
    name: Frontend build (node=${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: backend_quality

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: UsersAndPostsClient/package-lock.json

      - name: Install client deps
        working-directory: UsersAndPostsClient
        run: npm ci

      # (Steg 1) Vi antar att dtos.json finns genom att generatorn körts i backend_quality,
      # men i praktiken är det en separat runner. Artefakter kommer i Steg 2.
      # Just nu kör vi därför gen:dtos och build som en “strukturövning” för DAG/needs.
      - name: Generate dtos.ts from dtos.json
        working-directory: UsersAndPostsClient
        run: npm run gen:dtos

      - name: Build client (writes to API wwwroot)
        working-directory: UsersAndPostsClient
        run: npm run build

      - name: Fail if NPM build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi


  # ============================================================
  # 3) TEST
  # - needs: frontend_build  (så test körs efter att kedjan är “klar”)
  # ============================================================
  test:
    name: Test (dotnet=8.0.x)
    runs-on: ubuntu-latest
    needs: frontend_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: Build
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Test
        run: dotnet test UsersAndPosts.sln -c Release --no-build


  # ============================================================
  # 4) PUBLISH + ARTIFACT
  # - needs: test
  # ============================================================
  publish:
    name: Publish (dotnet=8.0.x)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: Build
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Publish API
        run: dotnet publish UsersAndPosts/UsersAndPosts.csproj -c Release -o out --no-build

      - name: Upload artifact (published app)
        uses: actions/upload-artifact@v4
        with:
          name: UsersAndPosts-publish
          path: out

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI summary (Step 1)"
            echo ""
            echo "- ✅ Pipeline split into jobs using \`needs\`"
            echo "- ✅ Backend quality + contract job"
            echo "- ✅ Frontend build job"
            echo "- ✅ Test job"
            echo "- ✅ Publish + artifact job"
            echo ""
            echo "> Note: In Step 1 we only modeled job order. Step 2 will pass artifacts (dtos.json, wwwroot, publish output) between jobs."
          } >> "$GITHUB_STEP_SUMMARY"
