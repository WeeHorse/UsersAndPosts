# ============================================================
# CI (Continuous Integration) för UsersAndPosts
#
# Steg 2 (Deep Dive): Artefakter mellan jobb
# - backend_contract producerar dtos.json → upload artifact
# - frontend_build konsumerar dtos.json, bygger wwwroot → upload artifact
# - test_publish konsumerar dtos.json + wwwroot och producerar deploybar out → upload artifact
# ============================================================

name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["cideep"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1) BACKEND + KONTRAKT
  # ============================================================
  backend_contract:
    name: Backend + Contract (node=${{ matrix.node }}, dotnet=${{ matrix.dotnet }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]
        dotnet: ["8.0.x", "9.0.x"]
        exclude:
          - node: "18.x"
            dotnet: "9.0.x"
          - node: "20.x"
            dotnet: "8.0.x"

    env:
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      # NuGet vulnerability check, gate and report
      - name: NuGet vulnerable packages (report)
        id: nuget_vuln
        run: |
          set +e
          report="nuget-vuln-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}.txt"
          dotnet list UsersAndPosts.sln package --vulnerable --include-transitive --verbosity detailed | tee "$report"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          echo "report=$report" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload NuGet vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-vulnerability-report-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: ${{ steps.nuget_vuln.outputs.report }}
          retention-days: 14

      - name: Add NuGet report to summary
        if: always()
        run: |
          echo "## NuGet vulnerability scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          report="${{ steps.nuget_vuln.outputs.report }}"
          if [ -n "$report" ] && [ -f "$report" ]; then
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            tail -n 200 "$report" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No NuGet vulnerability report file found (scan step may have failed early)._ " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if vulnerabilities found
        if: steps.nuget_vuln.outputs.exit_code != '0'
        run: exit 1

      - name: C# format check (dotnet format)
        run: dotnet format --verify-no-changes

      - name: Build (needed for generator)
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Fail if dotnet build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      - name: Generate dtos.json from C# DTOs
        run: dotnet run -c Release --project UsersAndPosts.DtoContractGen

      - name: Validate dtos.json exists and is valid JSON
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json was not generated" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('UsersAndPosts/dtos.json','utf8')); console.log('dtos.json OK');"

      # ---------------------------------------------------------
      # Artefakt 1: DTO-kontraktet (dtos.json)
      # Gör kontraktet till en "fysisk leverans" mellan jobb.
      # ---------------------------------------------------------
      - name: Upload artifact (dto contract)
        uses: actions/upload-artifact@v4
        with:
          name: dto-contract-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts/dtos.json

  # ============================================================
  # 2) FRONTEND
  # ============================================================
  frontend_build:
    name: Frontend (node=${{ matrix.node }}, dotnet=${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    needs: backend_contract

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]
        dotnet: ["8.0.x", "9.0.x"]
        exclude:
          - node: "18.x"
            dotnet: "9.0.x"
          - node: "20.x"
            dotnet: "8.0.x"

    env:
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Konsumera DTO-kontraktet från backend-jobbet
      # Vi laddar ner artefakten och lägger den på rätt plats i repot.
      # ---------------------------------------------------------
      - name: Download artifact (dto contract)
        uses: actions/download-artifact@v4
        with:
          name: dto-contract-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts

      - name: Validate downloaded dtos.json
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json missing after download" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('UsersAndPosts/dtos.json','utf8')); console.log('downloaded dtos.json OK');"

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: UsersAndPostsClient/package-lock.json

      - name: Install client deps
        working-directory: UsersAndPostsClient
        run: npm ci

      - name: Lint client (ESLint)
        working-directory: UsersAndPostsClient
        run: npm run lint

      - name: Generate dtos.ts from downloaded dtos.json
        working-directory: UsersAndPostsClient
        run: npm run gen:dtos

      - name: Build client (writes to API wwwroot)
        working-directory: UsersAndPostsClient
        run: npm run build

      - name: Fail if NPM build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      # ---------------------------------------------------------
      # Artefakt 2: Frontend output (API:s wwwroot)
      # Gör frontend-build till en "fysisk leverans" mellan jobb.
      # ---------------------------------------------------------
      - name: Upload artifact (wwwroot)
        uses: actions/upload-artifact@v4
        with:
          name: wwwroot-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts/wwwroot

  # ============================================================
  # 3) TEST + PUBLISH
  # ============================================================
  test_publish:
    name: Test + Publish (node=${{ matrix.node }}, dotnet=${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    needs: [backend_contract, frontend_build]

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]
        dotnet: ["8.0.x", "9.0.x"]
        exclude:
          - node: "18.x"
            dotnet: "9.0.x"
          - node: "20.x"
            dotnet: "8.0.x"

    env:
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Konsumera DTO-kontraktet igen (för publish + för att lägga i out/)
      - name: Download artifact (dto contract)
        uses: actions/download-artifact@v4
        with:
          name: dto-contract-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts

      # Konsumera wwwroot från frontend-jobbet
      - name: Download artifact (wwwroot)
        uses: actions/download-artifact@v4
        with:
          name: wwwroot-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts/wwwroot

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: Build (Release)
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Test
        run: dotnet test UsersAndPosts.sln -c Release --no-build

      - name: Publish API
        run: dotnet publish UsersAndPosts/UsersAndPosts.csproj -c Release -o out --no-build

      - name: Copy dtos.json into publish root
        run: cp UsersAndPosts/dtos.json out/dtos.json

      - name: Upload artifact (published app)
        uses: actions/upload-artifact@v4
        with:
          name: UsersAndPosts-publish-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: out

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "- Matrix: **.NET ${{ matrix.dotnet }}** × **Node ${{ matrix.node }}**"
            echo "- 📦 Consumed artifact: dto-contract → \`UsersAndPosts/dtos.json\`"
            echo "- 📦 Produced artifact: wwwroot → \`UsersAndPosts/wwwroot\`"
            echo "- ✅ Generated \`UsersAndPostsClient/src/generated/dtos.ts\` from the contract"
            echo "- ✅ Tested + published API (with frontend in wwwroot)"
            echo "- 📦 Uploaded artifact: **UsersAndPosts-publish-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}**"
          } >> "$GITHUB_STEP_SUMMARY"
