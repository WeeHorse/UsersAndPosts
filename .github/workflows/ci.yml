# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "publish" ]
  pull_request:
    branches: [ "publish" ]

jobs:
  # Main build job that runs on Ubuntu and performs CI for both backend (.NET) and frontend (Node.js)
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - uses: actions/checkout@v4

      # Install the .NET SDK (version 10.0.x) needed to build the backend
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Download and restore all NuGet dependencies for the .NET project
      - name: Restore dependencies
        run: dotnet restore

      # Compile the .NET solution (skip restore since dependencies were already downloaded)
      - name: Build
        working-directory: UsersAndPosts
        run: dotnet build --no-restore

      # --- DTO contract generation (build-time artifact) ---
      - name: Generate dtos.json from C# DTOs
        run: dotnet run -c Release --project UsersAndPosts.DtoContractGen

      - name: Validate dtos.json exists and is valid JSON
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json was not generated" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('UsersAndPosts/dtos.json','utf8')); console.log('dtos.json OK');"

      # Debug step to show current working directory and directory contents
      - name: Debug working directory
        run: |
          pwd
          ls -la

      # Install Node.js runtime (version 22) needed to build the React frontend
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache-dependency-path: UsersAndPostsClient/package-lock.json
          cache: "npm"

      # Install npm dependencies for the frontend project using clean install (package-lock.json enforced)
      - name: Restore npm dependencies
        working-directory: UsersAndPostsClient
        run: npm ci

      # Build the React frontend project (creates optimized production build)
      - name: Build npm
        working-directory: UsersAndPostsClient
        run: npm run build
        # Run the dotnet server in the background for testing
      - name: Run dotnet server
        working-directory: UsersAndPosts
        run: |
          dotnet run &
          sleep 5
          # Optional: Add health check or tests here
          echo "Server started"
