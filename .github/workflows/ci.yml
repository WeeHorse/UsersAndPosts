name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["cideep"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------
# Policy-flaggor (Steg 3)
# - Vi uttrycker vår "pipeline-policy" explicit.
# ------------------------------------------------------------
env:
  # Publicera deploybar artefakt även på push till dev-branch?
  # Sätt till "false" om du bara vill publicera på PR eller main senare.
  PUBLISH_ON_PUSH: "true"

jobs:
  # ============================================================
  # SECURITY (Steg 3)
  #
  # Ett separat jobb som körs EN gång per workflow (ingen matrix).
  # Syfte: tydlig parallellitet och tydlig policy-yta.
  #
  # I Steg 4 blir detta SARIF/CodeQL-jobbet.
  # ============================================================
  security_policy:
    name: Security policy (single run)
    runs-on: ubuntu-latest

    steps:
      - name: Policy summary
        run: |
          {
            echo "## Security policy"
            echo ""
            echo "- Event: **${{ github.event_name }}**"
            echo "- Ref: **${{ github.ref }}**"
            echo "- PR target: **${{ github.base_ref }}**"
            echo ""
            echo "### What this job does (Step 3)"
            echo "- Establishes a dedicated security lane (no matrix)."
            echo "- Step 4 will add SARIF-producing security scans here."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 1) BACKEND + KONTRAKT (matrix)
  # ============================================================
  backend_contract:
    name: Backend + Contract (node=${{ matrix.node }}, dotnet=${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    needs: security_policy # <- visar dependencies även mot ett "policy-jobb"

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]
        dotnet: ["8.0.x", "9.0.x"]
        exclude:
          - node: "18.x"
            dotnet: "9.0.x"
          - node: "20.x"
            dotnet: "8.0.x"

    env:
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      # ---------------------------------------------------------
      # NuGet vulnerability scan = rapport + (policy-styrd) gate
      #
      # - Vi vill ALLTID ha rapport (för insyn)
      # - Vi vill gate:a på PR (kvalitetsgrind inför merge)
      # ---------------------------------------------------------
      - name: NuGet vulnerable packages (report)
        id: nuget_vuln
        run: |
          set +e
          report="nuget-vuln-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}.txt"
          dotnet list UsersAndPosts.sln package --vulnerable --include-transitive --verbosity detailed | tee "$report"
          echo "report=$report" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload NuGet vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-vulnerability-report-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: ${{ steps.nuget_vuln.outputs.report }}
          retention-days: 14

      - name: Gate fail PR if vulnerabilities found
        if: github.event_name == 'pull_request'
        run: |
          report="${{ steps.nuget_vuln.outputs.report }}"
          if [ -f "$report" ] && grep -qi "vulnerab" "$report"; then
            echo "Vulnerable packages found (see report artifact)."
            exit 1
          fi

      - name: C# format check (dotnet format)
        run: dotnet format --verify-no-changes

      - name: Build (needed for generator)
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Fail if dotnet build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      - name: Generate dtos.json from C# DTOs
        run: dotnet run -c Release --project UsersAndPosts.DtoContractGen

      - name: Validate dtos.json exists and is valid JSON
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json was not generated" && exit 1)
          python -c "import json; json.load(open('UsersAndPosts/dtos.json')); print('dtos.json OK')"

      - name: Upload artifact (dto contract)
        uses: actions/upload-artifact@v4
        with:
          name: dto-contract-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts/dtos.json

  # ============================================================
  # 2) FRONTEND (matrix)
  # ============================================================
  frontend_build:
    name: Frontend (node=${{ matrix.node }}, dotnet=${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    needs: backend_contract

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]
        dotnet: ["8.0.x", "9.0.x"]
        exclude:
          - node: "18.x"
            dotnet: "9.0.x"
          - node: "20.x"
            dotnet: "8.0.x"

    env:
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact (dto contract)
        uses: actions/download-artifact@v4
        with:
          name: dto-contract-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts

      - name: Validate downloaded dtos.json
        run: |
          test -f UsersAndPosts/dtos.json || (echo "dtos.json missing after download" && exit 1)
          python -c "import json; json.load(open('UsersAndPosts/dtos.json')); print('downloaded dtos.json OK')"

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: UsersAndPostsClient/package-lock.json

      - name: Install client deps
        working-directory: UsersAndPostsClient
        run: npm ci

      - name: Lint client (ESLint)
        working-directory: UsersAndPostsClient
        run: npm run lint

      - name: Generate dtos.ts from downloaded dtos.json
        working-directory: UsersAndPostsClient
        run: npm run gen:dtos

      - name: Build client (writes to API wwwroot)
        working-directory: UsersAndPostsClient
        run: npm run build

      - name: Fail if NPM build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            echo ""
            echo "Diff (first 200 lines):"
            git diff | head -n 200
            exit 1
          fi

      - name: Upload artifact (wwwroot)
        uses: actions/upload-artifact@v4
        with:
          name: wwwroot-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts/wwwroot

  # ============================================================
  # 3) TEST + PUBLISH (matrix)
  # ============================================================
  test_publish:
    name: Test + Publish (node=${{ matrix.node }}, dotnet=${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    needs: [backend_contract, frontend_build]

    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]
        dotnet: ["8.0.x", "9.0.x"]
        exclude:
          - node: "18.x"
            dotnet: "9.0.x"
          - node: "20.x"
            dotnet: "8.0.x"

    env:
      VITE_API_BASE: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact (dto contract)
        uses: actions/download-artifact@v4
        with:
          name: dto-contract-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts

      - name: Download artifact (wwwroot)
        uses: actions/download-artifact@v4
        with:
          name: wwwroot-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: UsersAndPosts/wwwroot

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore UsersAndPosts.sln

      - name: Build (Release)
        run: dotnet build UsersAndPosts.sln -c Release --no-restore

      - name: Test
        run: dotnet test UsersAndPosts.sln -c Release --no-build

      - name: Publish API
        run: dotnet publish UsersAndPosts/UsersAndPosts.csproj -c Release -o out --no-build

      - name: Copy dtos.json into publish root
        run: cp UsersAndPosts/dtos.json out/dtos.json

      # ---------------------------------------------------------
      # Policy: publicera deploybar artefakt på PR,
      # och på push endast om PUBLISH_ON_PUSH är true.
      # ---------------------------------------------------------
      - name: Upload artifact (published app)
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && env.PUBLISH_ON_PUSH == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: UsersAndPosts-publish-dotnet${{ matrix.dotnet }}-node${{ matrix.node }}
          path: out

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "- Event: **${{ github.event_name }}**"
            echo "- Ref: **${{ github.ref }}**"
            echo "- Matrix: **.NET ${{ matrix.dotnet }}** × **Node ${{ matrix.node }}**"
            echo ""
            echo "### Flow"
            echo "- 📦 Consumed artifact: dto-contract → \`UsersAndPosts/dtos.json\`"
            echo "- 📦 Consumed artifact: wwwroot → \`UsersAndPosts/wwwroot\`"
            echo "- ✅ Tested + published API (with frontend in wwwroot)"
            echo ""
            echo "### Publish policy"
            echo "- PUBLISH_ON_PUSH: **${{ env.PUBLISH_ON_PUSH }}**"
            echo "- Upload publish artifact: **yes** if PR, or push+policy"
          } >> "$GITHUB_STEP_SUMMARY"
